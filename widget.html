<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#151311" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Note of the Day Widget — Pierre &amp; Ebba</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at 18% 15%, rgba(212, 175, 55, 0.15), transparent 52%),
                  radial-gradient(circle at 85% 82%, rgba(224, 159, 135, 0.14), transparent 50%),
                  #141210;
      color: #FAF7F2;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .widget-wrap {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .widget-card {
      position: relative;
      display: block;
      color: inherit;
      background: linear-gradient(145deg, #241F1B 0%, #151311 100%);
      border: 1px solid rgba(212, 175, 55, 0.38);
      border-radius: 26px;
      padding: 20px 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .widget-card::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 19px;
      border: 1px solid rgba(212, 175, 55, 0.14);
      pointer-events: none;
    }

    .widget-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .widget-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #D4AF37;
    }

    .widget-refresh {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #E7DFD3;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .widget-quote {
      position: relative;
      z-index: 1;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 25px;
      line-height: 1.32;
      color: #FAF7F2;
      margin: 0 0 16px;
      word-break: break-word;
    }

    .widget-footer {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: #B4A899;
    }

    .widget-actions {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .widget-write-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.16);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #E5C9A3;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.14s ease, background 0.18s ease;
    }

    .widget-write-btn:active { transform: scale(0.95); }

    .widget-hearts {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(224, 159, 135, 0.16);
      border: 1px solid rgba(224, 159, 135, 0.35);
      color: #E09F87;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.14s ease, background 0.18s ease;
    }

    .widget-hearts:active { transform: scale(0.93); }

    .widget-hearts.liked {
      background: rgba(224, 159, 135, 0.34);
      border-color: rgba(224, 159, 135, 0.72);
      color: #FFB4A2;
    }

    .widget-composer {
      position: relative;
      z-index: 2;
      display: none;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }

    .widget-composer.open {
      display: block;
    }

    .widget-composer textarea {
      width: 100%;
      min-height: 76px;
      resize: vertical;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(15, 13, 11, 0.7);
      color: #FAF7F2;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.45;
      outline: none;
    }

    .widget-composer textarea:focus {
      border-color: #D4AF37;
    }

    .widget-composer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 9px;
    }

    .widget-composer-btns {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .widget-btn-cancel {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #E7DFD3;
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .widget-btn-send {
      border: none;
      background: linear-gradient(135deg, #E5C9A3 0%, #C88C6B 100%);
      color: #1A1613;
      border-radius: 999px;
      padding: 6px 15px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .widget-status {
      min-height: 16px;
      font-size: 11.5px;
      color: #D4AF37;
      text-align: center;
    }

    .widget-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px;
      font-size: 12px;
      color: #9E9386;
    }

    .widget-link {
      color: #D4AF37;
      text-decoration: none;
      font-weight: 600;
    }

    .viewer-switch {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #D6CCC0;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="widget-wrap">
    <div class="widget-card" id="widgetCard">
      <div class="widget-top">
        <div class="widget-kicker" id="widgetKicker">✦ NOTE OF THE DAY</div>
        <button type="button" class="widget-refresh" id="refreshBtn" title="Refresh note" aria-label="Refresh">↻</button>
      </div>
      <p class="widget-quote" id="widgetQuote">Loading your partner’s latest note...</p>
      <div class="widget-footer">
        <span id="widgetMeta">Pierre &amp; Ebba</span>
        <div class="widget-actions">
          <button type="button" class="widget-write-btn" id="writeToggleBtn" title="Write a Note of the Day">✎ Note</button>
          <button type="button" class="widget-hearts" id="widgetHearts" title="Like partner's note">♡ 0</button>
        </div>
      </div>

      <div class="widget-composer" id="widgetComposer">
        <textarea id="widgetNoteInput" maxlength="240" placeholder="Write a sweet Note of the Day..."></textarea>
        <div class="widget-composer-row">
          <span id="widgetCharCount" style="font-size:11px;color:#9E9386;">0 / 240</span>
          <div class="widget-composer-btns">
            <button type="button" class="widget-btn-cancel" id="cancelComposeBtn">Cancel</button>
            <button type="button" class="widget-btn-send" id="sendNoteBtn">Send ♥</button>
          </div>
        </div>
      </div>
    </div>

    <div class="widget-status" id="widgetStatus"></div>

    <div class="widget-bar">
      <button type="button" class="viewer-switch" id="viewerSwitchBtn">Viewing as Pierre</button>
      <a class="widget-link" href="./index.html?tab=lists">Open full app &rarr;</a>
    </div>
  </div>

  <script>
    (() => {
      'use strict';
      const NTFY_STATE_TOPIC = 'pierre_ebba_shared_v2_907521e5';
      const NTFY_NOTIF_PIERRE = 'pierre_ebba_notif_pierre_907521e5';
      const NTFY_NOTIF_EBBA = 'pierre_ebba_notif_ebba_907521e5';
      const NTFY_WIDGET_TOPIC = 'pierre_ebba_widget_907521e5';
      const KV_APP_KEY = 'x0c969je';
      const KV_BASE = 'https://keyvalue.immanuel.co/api/KeyVal';
      const APP_PUBLIC_URL = 'https://pierre38610.github.io/pierre-ebba-lists/';
      const CLIENT_ID = 'wid_' + Math.random().toString(36).slice(2, 10);

      const params = new URLSearchParams(window.location.search);
      let viewer = params.get('user');
      if (viewer !== 'Pierre' && viewer !== 'Ebba') {
        viewer = localStorage.getItem('pe_current_user_v1') === 'Ebba' ? 'Ebba' : 'Pierre';
      }

      let snapshot = { p: null, e: null, m: null };

      function setStatus(msg) {
        const el = document.getElementById('widgetStatus');
        el.textContent = msg || '';
        clearTimeout(el._timer);
        if (msg) {
          el._timer = setTimeout(() => { el.textContent = ''; }, 2600);
        }
      }

      function bytesToBase64Url(bytes) {
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
      }

      function base64UrlToBytes(str) {
        const pad = str.length % 4 ? '='.repeat(4 - (str.length % 4)) : '';
        const b64 = str.replace(/-/g, '+').replace(/_/g, '/') + pad;
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      async function decodePayload(str) {
        if (!str || typeof str !== 'string') return null;
        if (str.startsWith('{')) return JSON.parse(str);
        if (str.startsWith('GZ_') && typeof DecompressionStream !== 'undefined') {
          const bytes = base64UrlToBytes(str.slice(3));
          const ds = new DecompressionStream('gzip');
          const writer = ds.writable.getWriter();
          writer.write(bytes);
          writer.close();
          return JSON.parse(await new Response(ds.readable).text());
        }
        if (str.startsWith('RAW_')) {
          return JSON.parse(new TextDecoder().decode(base64UrlToBytes(str.slice(4))));
        }
        return null;
      }

      function mergeNote(cur, inc) {
        if (!inc || !inc.text) return cur;
        if (!cur || (inc.updatedAt || 0) >= (cur.updatedAt || 0)) return inc;
        return cur;
      }

      function mergeSnapshot(inc) {
        if (!inc || typeof inc !== 'object') return;
        snapshot.p = mergeNote(snapshot.p, inc.p);
        snapshot.e = mergeNote(snapshot.e, inc.e);
        snapshot.m = mergeNote(snapshot.m, inc.m);
        if (snapshot.m && snapshot.m.text) {
          if (snapshot.m.author === 'Pierre') snapshot.p = mergeNote(snapshot.p, snapshot.m);
          if (snapshot.m.author === 'Ebba') snapshot.e = mergeNote(snapshot.e, snapshot.m);
        }
      }

      function loadLocalFallback() {
        try {
          const raw = localStorage.getItem('pe_shared_state_v2');
          if (!raw) return;
          const st = JSON.parse(raw);
          if (st.partnerNotes) {
            mergeSnapshot({ p: st.partnerNotes.Pierre, e: st.partnerNotes.Ebba, m: st.petitMot });
          } else if (st.petitMot) {
            mergeSnapshot({ m: st.petitMot });
          }
        } catch (_) {}
      }

      function getLocalDateKey(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function isNoteFromToday(note) {
        if (!note || !note.text || !note.updatedAt) return false;
        return getLocalDateKey(new Date(note.updatedAt)) === getLocalDateKey();
      }

      function getPartnerOwnNote() {
        const partner = viewer === 'Pierre' ? 'Ebba' : 'Pierre';
        const slot = viewer === 'Pierre' ? snapshot.e : snapshot.p;
        if (slot && slot.text) return slot;
        if (snapshot.m && snapshot.m.text && snapshot.m.author === partner) return snapshot.m;
        return null;
      }

      function formatRelTime(ts) {
        if (!ts) return 'Just synced';
        const diff = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        if (diff < 60) return 'Just now';
        if (diff < 3600) return `${Math.floor(diff / 60)} min ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)} h ago`;
        return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function render() {
        const partner = viewer === 'Pierre' ? 'Ebba' : 'Pierre';
        document.getElementById('viewerSwitchBtn').textContent = `Viewing as ${viewer} (tap to switch)`;
        document.getElementById('widgetNoteInput').placeholder = `Write a note for ${partner} ♥...`;

        const partnerNote = getPartnerOwnNote();
        const candidate = partnerNote || (snapshot.m && snapshot.m.text ? snapshot.m : null);
        const chosen = isNoteFromToday(candidate) ? candidate : null;
        const heartsEl = document.getElementById('widgetHearts');

        if (chosen && chosen.text) {
          const who = chosen.author || partner;
          const heartedBy = Array.isArray(chosen.heartedBy) ? chosen.heartedBy : [];
          const liked = heartedBy.includes(viewer);
          document.getElementById('widgetKicker').textContent = `✦ NOTE FROM ${who.toUpperCase()}`;
          document.getElementById('widgetQuote').textContent = chosen.text;
          document.getElementById('widgetMeta').textContent = `${formatRelTime(chosen.updatedAt)}`;
          heartsEl.textContent = `${liked ? '♥' : '♡'} ${chosen.hearts || 0}`;
          heartsEl.classList.toggle('liked', liked);
        } else {
          document.getElementById('widgetKicker').textContent = '✦ NOTE OF THE DAY';
          document.getElementById('widgetQuote').textContent = 'New day! Write today’s Note of the Day ✨';
          document.getElementById('widgetMeta').textContent = 'Tap ✎ Note to write';
          heartsEl.textContent = '♡ 0';
          heartsEl.classList.remove('liked');
        }
      }

      async function kvPostWithRetry(key, val, retries = 2) {
        const url = `${KV_BASE}/UpdateValue/${KV_APP_KEY}/${key}/${val}`;
        for (let i = 0; i <= retries; i++) {
          try {
            const r = await fetch(url, { method: 'POST' });
            if (r.ok) return true;
          } catch (_) {}
          if (i < retries) await new Promise((res) => setTimeout(res, 180 * (i + 1)));
        }
        return false;
      }

      function compactNote(note) {
        if (!note || !note.text) return null;
        return {
          text: String(note.text).slice(0, 240),
          author: note.author || '',
          hearts: Number(note.hearts) || 0,
          heartedBy: Array.isArray(note.heartedBy) ? [...note.heartedBy] : [],
          updatedAt: Number(note.updatedAt) || 0
        };
      }

      async function publishChanges(updatedOwner, updatedOwnerNote, petitMotToSend, activity, pushTag) {
        const snap = {
          p: compactNote(snapshot.p),
          e: compactNote(snapshot.e),
          m: compactNote(snapshot.m)
        };

        try {
          await fetch('https://ntfy.sh/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              topic: NTFY_WIDGET_TOPIC,
              message: JSON.stringify(snap)
            })
          });
        } catch (_) {}

        try {
          const stObj = { partnerNotes: { [updatedOwner]: compactNote(updatedOwnerNote) } };
          if (petitMotToSend) stObj.petitMot = compactNote(petitMotToSend);
          await fetch('https://ntfy.sh/' + NTFY_STATE_TOPIC, {
            method: 'POST',
            body: JSON.stringify({
              v: 1,
              sender: CLIENT_ID,
              actor: viewer,
              ts: Date.now(),
              activity: activity ? {
                id: 'act_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
                actor: viewer,
                category: 'mot',
                title: activity.title,
                body: activity.body,
                tab: 'lists'
              } : null,
              state: stObj
            })
          });
        } catch (_) {}

        if (activity) {
          const targetTopic = viewer === 'Ebba' ? NTFY_NOTIF_PIERRE : NTFY_NOTIF_EBBA;
          try {
            await fetch('https://ntfy.sh/', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                topic: targetTopic,
                title: activity.title,
                message: activity.body,
                priority: 4,
                tags: [pushTag || 'sparkles'],
                click: APP_PUBLIC_URL + '?tab=lists',
                icon: APP_PUBLIC_URL + 'icon-192.png'
              })
            });
          } catch (_) {}
        }

        try {
          const encoded = 'RAW_' + bytesToBase64Url(new TextEncoder().encode(JSON.stringify(snap)));
          const chunks = [];
          for (let i = 0; i < encoded.length; i += 175) chunks.push(encoded.slice(i, i + 175));
          const gen = Date.now().toString(36);
          for (let i = 0; i < chunks.length; i++) {
            const ok = await kvPostWithRetry(`ebba_v2_wn_${gen}_${i}`, chunks[i]);
            if (!ok) return;
          }
          await kvPostWithRetry('ebba_v2_wn_meta', `${gen}-${chunks.length}`);
        } catch (_) {}
      }

      async function toggleLikePartnerNote() {
        const partner = viewer === 'Pierre' ? 'Ebba' : 'Pierre';
        const target = getPartnerOwnNote();
        if (!isNoteFromToday(target)) {
          setStatus(`No note from ${partner} today yet`);
          return;
        }
        const list = Array.isArray(target.heartedBy) ? [...target.heartedBy] : [];
        const idx = list.indexOf(viewer);
        let likedNow = false;
        let nextHearts = Number(target.hearts) || 0;
        if (idx >= 0) {
          list.splice(idx, 1);
          nextHearts = Math.max(0, nextHearts - 1);
        } else {
          list.push(viewer);
          nextHearts += 1;
          likedNow = true;
        }
        const updated = {
          ...target,
          author: target.author || partner,
          hearts: nextHearts,
          heartedBy: list,
          updatedAt: Date.now()
        };
        if (partner === 'Pierre') snapshot.p = updated;
        else snapshot.e = updated;

        let motToSend = null;
        if (snapshot.m && snapshot.m.author === partner && snapshot.m.text === target.text) {
          snapshot.m = updated;
          motToSend = updated;
        }
        render();
        setStatus(likedNow ? `Sent ♥ to ${partner}` : 'Removed like');

        const activity = likedNow ? {
          title: `♥ ${viewer} liked your Note of the Day`,
          body: `"${updated.text}"`
        } : null;
        await publishChanges(partner, updated, motToSend, activity, 'heart');
      }

      async function sendMyNote() {
        const input = document.getElementById('widgetNoteInput');
        const text = input.value.trim();
        if (!text) {
          setStatus('Write a short note first ♥');
          return;
        }
        const sendBtn = document.getElementById('sendNoteBtn');
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending...';

        const partner = viewer === 'Pierre' ? 'Ebba' : 'Pierre';
        const noteObj = {
          text: text.slice(0, 240),
          author: viewer,
          hearts: 0,
          heartedBy: [],
          updatedAt: Date.now()
        };
        if (viewer === 'Pierre') snapshot.p = noteObj;
        else snapshot.e = noteObj;
        snapshot.m = noteObj;

        input.value = '';
        document.getElementById('widgetCharCount').textContent = '0 / 240';
        document.getElementById('widgetComposer').classList.remove('open');
        render();

        await publishChanges(
          viewer,
          noteObj,
          noteObj,
          { title: `💌 New Note of the Day from ${viewer}`, body: noteObj.text },
          'love_letter'
        );
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send ♥';
        setStatus(`Note sent to ${partner} ♥`);
      }

      async function refresh() {
        try {
          const metaRes = await fetch(`${KV_BASE}/GetValue/${KV_APP_KEY}/ebba_v2_wn_meta`, { cache: 'no-store' });
          if (metaRes.ok) {
            const rawMeta = await metaRes.json();
            if (rawMeta && typeof rawMeta === 'string' && rawMeta.includes('-')) {
              const idx = rawMeta.lastIndexOf('-');
              const gen = rawMeta.slice(0, idx);
              const count = parseInt(rawMeta.slice(idx + 1), 10);
              if (gen && count > 0 && count <= 40) {
                const parts = await Promise.all(
                  Array.from({ length: count }, (_, i) =>
                    fetch(`${KV_BASE}/GetValue/${KV_APP_KEY}/ebba_v2_wn_${gen}_${i}`, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : ''))
                  )
                );
                if (parts.every(Boolean)) {
                  const dec = await decodePayload(parts.join(''));
                  if (dec) mergeSnapshot(dec);
                }
              }
            }
          }
        } catch (_) {}

        try {
          const r = await fetch(`https://ntfy.sh/${NTFY_WIDGET_TOPIC}/json?poll=1&since=all`, { cache: 'no-store' });
          if (r.ok) {
            const lines = (await r.text()).split('\n').filter(Boolean);
            for (const line of lines) {
              try {
                const evt = JSON.parse(line);
                if (evt.event === 'message' && evt.message) {
                  const inc = await decodePayload(evt.message);
                  if (inc) mergeSnapshot(inc);
                }
              } catch (_) {}
            }
          }
        } catch (_) {}

        render();
      }

      document.getElementById('refreshBtn').onclick = () => {
        refresh();
        setStatus('Refreshed');
      };

      document.getElementById('widgetHearts').onclick = () => toggleLikePartnerNote();

      document.getElementById('writeToggleBtn').onclick = () => {
        const comp = document.getElementById('widgetComposer');
        const opening = !comp.classList.contains('open');
        comp.classList.toggle('open', opening);
        if (opening) {
          setTimeout(() => document.getElementById('widgetNoteInput').focus(), 40);
        }
      };

      document.getElementById('cancelComposeBtn').onclick = () => {
        document.getElementById('widgetComposer').classList.remove('open');
      };

      document.getElementById('widgetNoteInput').oninput = (e) => {
        document.getElementById('widgetCharCount').textContent = `${e.target.value.length} / 240`;
      };

      document.getElementById('sendNoteBtn').onclick = sendMyNote;

      document.getElementById('viewerSwitchBtn').onclick = () => {
        viewer = viewer === 'Pierre' ? 'Ebba' : 'Pierre';
        render();
      };

      loadLocalFallback();
      render();
      refresh();

      try {
        const es = new EventSource(`https://ntfy.sh/${NTFY_WIDGET_TOPIC}/sse`);
        es.onmessage = async (ev) => {
          try {
            const evt = JSON.parse(ev.data);
            if (evt.event === 'message' && evt.message) {
              const inc = await decodePayload(evt.message);
              if (inc) {
                mergeSnapshot(inc);
                render();
              }
            }
          } catch (_) {}
        };
      } catch (_) {}
    })();
  </script>
</body>
