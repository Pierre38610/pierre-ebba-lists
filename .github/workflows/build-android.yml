name: Build Android Companion APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/pe-release.jks"
            echo "KEYSTORE_FILE=${{ runner.temp }}/pe-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Built APK: $APK_SRC"
          cp "$APK_SRC" "${{ github.workspace }}/pierre-ebba.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pierre-ebba-apk
          path: pierre-ebba.apk

      - name: Publish APK to GitHub Release (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest pierre-ebba.apk --clobber
          else
            gh release create android-latest pierre-ebba.apk \
              --title "Pierre & Ebba Android App" \
              --notes "Companion Android app featuring native Note of the Day Home Screen Widget and instant message-style notifications." \
              --latest
          fi
